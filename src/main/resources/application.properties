# MAILING SERVICE INTEGRATION
## Date format used when parsing information about orders to be sent in e-mails
monostudio.mailing.date-format=M/d/y z
## Timezone to deduce dates from, when parsing the same information
monostudio.mailing.date-timezone=UTC
## Name of the owner/company/employee to notify to
monostudio.mailing.owner-name=Foo bar
## Fully qualified owner/company/employee mail to notify to
monostudio.mailing.owner-email=Foo bar <foobar@example.com>
## Fully qualified sender/remitent mail to send mails with
monostudio.mailing.sender-email=Automatic Mailing System <noreply@example.com>
## Subject of mails sent to customers after payment
monostudio.mailing.customer-order-payment-subject=Xac nhan thanh toan don hang
## Subject of mails sent to customers after their order has been confirmed
monostudio.mailing.customer-order-confirmation-subject=Don hang #%s da duoc xac nhan
## Subject of mails sent to customers after their order has been rejected
monostudio.mailing.customer-order-rejection-subject=Don hang #%s da bi huy
## Subject of mails sent to customers after their order has been completed/delivered
monostudio.mailing.customer-order-completion-subject=Don hang #%s da hoan thanh
## Subject of mails sent to owner/company/employee after a new order has been confirmed
monostudio.mailing.owner-order-confirmation-subject=Don hang moi #%s - can xac nhan
## (Not used) Subject of mails sent to owner/company/employee after an order has been rejected
monostudio.mailing.owner-order-rejection-subject=Don hang #%s bi huy - can kiem tra
## (Not used) Subject of mails sent to owner/company/employee after an order has been completed/delivered
monostudio.mailing.owner-order-completion-subject=Don hang #%s da hoan thanh
monostudio.mailing.customer-return-request-created-subject=Yeu cau tra hang #%s da duoc gui
monostudio.mailing.customer-return-request-approved-subject=Yeu cau tra hang #%s da duoc duyet
monostudio.mailing.customer-return-request-rejected-subject=Yeu cau tra hang #%s bi tu choi
monostudio.mailing.customer-return-request-refund-completed-subject=Hoan tien yeu cau tra hang #%s hoan tat
