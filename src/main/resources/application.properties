# ==============================
# KAFKA CONFIGURATION
# ==============================
# Bootstrap address — Spring Boot runs on the host, Kafka is in Docker with port 9092 mapped to host
spring.kafka.bootstrap-servers=localhost:9092

# Producer: serialize keys as plain String, values as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: deserialize using matching JSON deserializer
spring.kafka.consumer.group-id=mail-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust these packages so JsonDeserializer can reconstruct the MailEvent and its nested POJOs
spring.kafka.consumer.properties.spring.json.trusted.packages=org.monostudio.mailing.kafka,org.monostudio.ordering.kafka,org.monostudio.api.models,org.monostudio.search.kafka,org.monostudio.shipping.kafka
# Start from earliest offset when no committed offset exists (useful on first run / new consumer group)
spring.kafka.consumer.auto-offset-reset=earliest

