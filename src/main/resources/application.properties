# PAYMENT SERVICE INTEGRATION
# WEBPAY PLUS
## Whether production mode is enabled
monostudio.payment.webpayplus.production=${WEBPAY_PRODUCTION:false}
## URL that Webpay Plus will redirect user to after going through their checkout page is over
monostudio.payment.webpayplus.callback-url=http://localhost:8080/api/public/checkout/validate
## URL that the backend itself will redirect user to after receiving response from Webay Plus
monostudio.payment.webpayplus.browser-redirection-url=http://localhost:4200/store/receipt


# POSTGRESQL DATABASE DRIVER
spring.datasource.url=jdbc:postgresql://localhost:5432/graduation_ecommerce
spring.datasource.username=nguyendd
spring.datasource.password=20042809


# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.defer-datasource-initialization=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=ALWAYS
management.endpoint.metrics.enabled=true

logging.charset.file=UTF-8

# MINIO CONFIGURATION
monostudio.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
monostudio.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
monostudio.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
monostudio.minio.bucket-name=${MINIO_BUCKET:graduation-ecommerce}
monostudio.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# FILE UPLOAD SETTINGS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

