server.port=8080
spring.jackson.default-property-inclusion=non_default
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false
monostudio.api.items-per-page=10
monostudio.api.max-allowed-page-size=1000
monostudio.api.max-category-fetching-recursion-depth=20
monostudio.api.able-to-edit-orders-after-being-processed=false
monostudio.validation.id-number-regexp=^\d{7,9}[\dk]$
monostudio.validation.phonenumber-regexp=^\\+(?:[0-9] ?){6,14}[0-9]$

monostudio.security.jwt-secret-key=^_>!Q6xf/|kO4B8_eN*){QINS83Q>j.io3V%uUmK^m8

monostudio.security.jwt-expiration-after-minutes=30
monostudio.security.jwt-expiration-after-hours=0
monostudio.security.jwt-expiration-after-days=0

monostudio.security.bcrypt-encoder-strength=10
monostudio.security.guest-user-enabled=false
monostudio.security.guest-user-name=guest
monostudio.security.guest-user-role-id=4
monostudio.security.account-protection-enabled=true
monostudio.security.protected-account-id=1

monostudio.cors.list-delimiter=;
monostudio.cors.allowed-headers=Content-Type;Accept;X-Requested-With;Authorization
monostudio.cors.allowed-origins=http://localhost:4200;https://localhost:4200;http://localhost:3000;https://localhost:3000;null
monostudio.cors.mappings=\
